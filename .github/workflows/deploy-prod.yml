on:
  schedule:
    - cron: '10 8 * * 1'
  workflow_dispatch:

name: Deploy Prod

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Open production pull request
    runs-on: ubuntu-latest

    steps:
      - name: Open a pull request from main to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/production...main" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "production already contains main"
            exit 0
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base production --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "pull request #$existing is already open"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base production --head main \
            --title "Deploy main to production" \
            --body "Opened by the deploy workflow. Merging publishes main to production."
