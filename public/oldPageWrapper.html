<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <title>Streaming Live</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto&family=Source+Code+Pro" rel="stylesheet">
  </link>
  <style>
    img {max-width:100% !important;}
  </style>
</head>

<body style="padding:15px;">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    };

    (function () {
      var raw = getUrlParameter("url");
      var url;
      try { url = new URL(raw, window.location.href); } catch (e) { return; }
      if (url.protocol !== "https:" && url.protocol !== "http:") return;
      var frame = document.createElement("iframe");
      frame.src = url.href;
      frame.setAttribute("sandbox", "");
      frame.style.cssText = "border:0;width:100%;min-height:100vh;";
      document.getElementById("root").appendChild(frame);
    })();

  </script>

</body>

</html>
